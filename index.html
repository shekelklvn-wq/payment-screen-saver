<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DVD Bounce Display</title>
  <style>
    :root {
      --panel-bg: rgba(10, 10, 16, 0.78);
      --panel-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #fff200;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #001ef9;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      position: fixed;
      inset: 0;
    }

    body {
      min-height: 100dvh;
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
    }

    .panel {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 3;
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: opacity 180ms ease, transform 180ms ease;
      touch-action: manipulation;
    }

    .is-playback .panel {
      pointer-events: none;
      opacity: 0;
      transform: translateY(18px);
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    label,
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    input,
    button {
      font: inherit;
    }

    input[type="file"] {
      width: 100%;
      min-height: 44px;
      color: var(--text);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
    }

    .check {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .check input {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--accent);
    }

    button {
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    button:active {
      transform: translateY(1px);
      background: rgba(255, 255, 255, 0.24);
    }

    .wake {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
    }

    .is-playback .wake {
      display: block;
    }

    @media (max-width: 980px) {
      .panel {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .field.file {
        grid-column: span 2;
      }
    }

    @media (max-width: 700px) {
      .panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="is-playback">
  <canvas id="stage" aria-label="Bouncing display canvas"></canvas>
  <button class="wake" id="wakeButton" aria-label="Show controls"></button>

  <section class="panel" id="panel" aria-label="Display controls">
    <div class="field file">
      <label for="imageInput">Object</label>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/svg+xml">
    </div>

    <div class="field">
      <label for="sizeInput">Size</label>
      <input id="sizeInput" type="range" min="90" max="620" step="1">
    </div>

    <div class="field">
      <label for="speedXInput">Speed X</label>
      <input id="speedXInput" type="range" min="0" max="520" step="1">
    </div>

    <div class="field">
      <label for="speedYInput">Speed Y</label>
      <input id="speedYInput" type="range" min="0" max="520" step="1">
    </div>

    <div class="field">
      <label for="backgroundInput">Background</label>
      <input id="backgroundInput" type="color">
    </div>

    <div class="field">
      <label for="tintInput">Tint</label>
      <input id="tintInput" type="color">
    </div>

    <label class="check">
      <input id="autoColorInput" type="checkbox">
      Bounce color
    </label>

    <button id="fullscreenButton" type="button">Fullscreen</button>
    <button id="playbackButton" type="button">Playback</button>
  </section>

AAAADI9z/q/ur13pSlvwAAAABJRU5ErkJggg==";

    // Bounce colors avoid the blue background.
    const BOUNCE_COLORS = [
      "#ffffff",
      "#fff200",
      "#ff2aa1",
      "#39ff14",
      "#ff6a00",
      "#ff4040",
      "#f5f0e8"
    ];

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const panel = document.getElementById("panel");
    const wakeButton = document.getElementById("wakeButton");
    const imageInput = document.getElementById("imageInput");
    const sizeInput = document.getElementById("sizeInput");
    const speedXInput = document.getElementById("speedXInput");
    const speedYInput = document.getElementById("speedYInput");
    const backgroundInput = document.getElementById("backgroundInput");
    const tintInput = document.getElementById("tintInput");
    const autoColorInput = document.getElementById("autoColorInput");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const playbackButton = document.getElementById("playbackButton");

    const state = {
      imageData: DEFAULT_IMAGE_DATA_URL,
      objectSize: DEFAULT_OBJECT_SIZE,
      speedX: DEFAULT_SPEED_X,
      speedY: DEFAULT_SPEED_Y,
      background: DEFAULT_BACKGROUND,
      tint: BOUNCE_COLORS[0],
      autoColor: true
    };

    const motion = {
      x: 80,
      y: 70,
      vx: DEFAULT_SPEED_X,
      vy: DEFAULT_SPEED_Y,
      width: DEFAULT_OBJECT_SIZE,
      height: DEFAULT_OBJECT_SIZE,
      lastTime: 0,
      colorIndex: 0
    };

    const objectImage = new Image();
    const tintCanvas = document.createElement("canvas");
    const tintCtx = tintCanvas.getContext("2d");
    let imageAspect = 1;
    let saveTimer = 0;

    // Persistence.
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || typeof saved !== "object") return;
        Object.assign(state, {
          imageData: typeof saved.imageData === "string" ? saved.imageData : state.imageData,
          objectSize: clampNumber(saved.objectSize, 90, 620, state.objectSize),
          speedX: clampNumber(saved.speedX, 0, 520, state.speedX),
          speedY: clampNumber(saved.speedY, 0, 520, state.speedY),
          background: isHexColor(saved.background) ? saved.background : state.background,
          tint: isHexColor(saved.tint) ? saved.tint : state.tint,
          autoColor: typeof saved.autoColor === "boolean" ? saved.autoColor : state.autoColor
        });
      } catch (error) {
        console.warn("Could not restore saved display settings.", error);
      }
    }

    function saveStateSoon() {
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.warn("Could not save settings. The uploaded image may be too large.", error);
        }
      }, 120);
    }

    // Layout and drawing.
    function resizeCanvas() {
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
      const width = Math.max(1, Math.floor(window.innerWidth));
      const height = Math.max(1, Math.floor(window.innerHeight));
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      updateObjectSize();
      motion.x = clampNumber(motion.x, 0, Math.max(0, width - motion.width), 0);
      motion.y = clampNumber(motion.y, 0, Math.max(0, height - motion.height), 0);
    }

    function updateObjectSize() {
      const maxWidth = Math.max(80, window.innerWidth * 0.82);
      const maxHeight = Math.max(80, window.innerHeight * 0.82);
      motion.width = Math.min(state.objectSize, maxWidth, maxHeight * imageAspect);
      motion.height = motion.width / imageAspect;
      if (motion.height > maxHeight) {
        motion.height = maxHeight;
        motion.width = motion.height * imageAspect;
      }
    }

    function drawFrame() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.fillStyle = state.background;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      if (!objectImage.complete || !objectImage.naturalWidth) return;

      const tintWidth = Math.max(1, Math.ceil(motion.width));
      const tintHeight = Math.max(1, Math.ceil(motion.height));
      if (tintCanvas.width !== tintWidth || tintCanvas.height !== tintHeight) {
        tintCanvas.width = tintWidth;
        tintCanvas.height = tintHeight;
      }

      tintCtx.clearRect(0, 0, tintWidth, tintHeight);
      tintCtx.globalCompositeOperation = "source-over";
      tintCtx.drawImage(objectImage, 0, 0, tintWidth, tintHeight);
      tintCtx.globalCompositeOperation = "source-in";
      tintCtx.fillStyle = state.tint;
      tintCtx.fillRect(0, 0, tintWidth, tintHeight);
      tintCtx.globalCompositeOperation = "source-over";
      ctx.drawImage(tintCanvas, motion.x, motion.y, motion.width, motion.height);
    }

    // Animation.
    function animate(time) {
      if (!motion.lastTime) motion.lastTime = time;
      const dt = Math.min(0.05, (time - motion.lastTime) / 1000);
      motion.lastTime = time;

      const boundsWidth = window.innerWidth;
      const boundsHeight = window.innerHeight;
      let bounced = false;

      motion.x += motion.vx * dt;
      motion.y += motion.vy * dt;

      if (motion.x <= 0) {
        motion.x = 0;
        motion.vx = Math.abs(motion.vx);
        bounced = true;
      } else if (motion.x + motion.width >= boundsWidth) {
        motion.x = Math.max(0, boundsWidth - motion.width);
        motion.vx = -Math.abs(motion.vx);
        bounced = true;
      }

      if (motion.y <= 0) {
        motion.y = 0;
        motion.vy = Math.abs(motion.vy);
        bounced = true;
      } else if (motion.y + motion.height >= boundsHeight) {
        motion.y = Math.max(0, boundsHeight - motion.height);
        motion.vy = -Math.abs(motion.vy);
        bounced = true;
      }

      if (bounced && state.autoColor) {
        motion.colorIndex = (motion.colorIndex + 1) % BOUNCE_COLORS.length;
        state.tint = BOUNCE_COLORS[motion.colorIndex];
        tintInput.value = state.tint;
        saveStateSoon();
      }

      drawFrame();
      requestAnimationFrame(animate);
    }

    // Controls.
    function syncControls() {
      sizeInput.value = String(state.objectSize);
      speedXInput.value = String(state.speedX);
      speedYInput.value = String(state.speedY);
      backgroundInput.value = state.background;
      tintInput.value = state.tint;
      autoColorInput.checked = state.autoColor;
      document.body.style.background = state.background;
    }

    function loadObject(src) {
      objectImage.onload = () => {
        imageAspect = objectImage.naturalWidth / objectImage.naturalHeight || 1;
        updateObjectSize();
        motion.x = clampNumber(motion.x, 0, Math.max(0, window.innerWidth - motion.width), 0);
        motion.y = clampNumber(motion.y, 0, Math.max(0, window.innerHeight - motion.height), 0);
        drawFrame();
      };
      objectImage.src = src;
    }

    function setVelocity(axis, value) {
      const speed = Number(value) || 0;
      if (axis === "x") {
        state.speedX = speed;
        motion.vx = (motion.vx < 0 ? -1 : 1) * speed;
      } else {
        state.speedY = speed;
        motion.vy = (motion.vy < 0 ? -1 : 1) * speed;
      }
      saveStateSoon();
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (!/^image\/(png|jpeg|svg\+xml)$/.test(file.type)) return;

      const reader = new FileReader();
      reader.onload = () => {
        state.imageData = String(reader.result);
        loadObject(state.imageData);
        saveStateSoon();
      };
      reader.readAsDataURL(file);
    });

    sizeInput.addEventListener("input", () => {
      state.objectSize = Number(sizeInput.value) || DEFAULT_OBJECT_SIZE;
      updateObjectSize();
      motion.x = clampNumber(motion.x, 0, Math.max(0, window.innerWidth - motion.width), 0);
      motion.y = clampNumber(motion.y, 0, Math.max(0, window.innerHeight - motion.height), 0);
      saveStateSoon();
    });

    speedXInput.addEventListener("input", () => setVelocity("x", speedXInput.value));
    speedYInput.addEventListener("input", () => setVelocity("y", speedYInput.value));

    backgroundInput.addEventListener("input", () => {
      state.background = backgroundInput.value;
      document.body.style.background = state.background;
      saveStateSoon();
    });

    tintInput.addEventListener("input", () => {
      state.tint = tintInput.value;
      state.autoColor = false;
      autoColorInput.checked = false;
      saveStateSoon();
    });

    autoColorInput.addEventListener("change", () => {
      state.autoColor = autoColorInput.checked;
      saveStateSoon();
    });

    fullscreenButton.addEventListener("click", async () => {
      const target = document.documentElement;
      try {
        if (target.requestFullscreen) await target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      } catch (error) {
        console.warn("Fullscreen request was not available.", error);
      }
    });

    playbackButton.addEventListener("click", () => {
      document.body.classList.add("is-playback");
    });

    wakeButton.addEventListener("click", () => {
      document.body.classList.remove("is-playback");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") document.body.classList.remove("is-playback");
    });

    document.addEventListener("touchmove", (event) => {
      if (!event.target.closest(".panel")) event.preventDefault();
    }, { passive: false });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => window.setTimeout(resizeCanvas, 250));

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.max(min, Math.min(max, number));
    }

    function isHexColor(value) {
      return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
    }

    // Startup.
    loadState();
    motion.vx = state.speedX;
    motion.vy = state.speedY;
    syncControls();
    resizeCanvas();
    loadObject(state.imageData);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
